                                            <div className="w-10 h-10 bg-brand-50 text-brand-600 rounded-xl flex items-center justify-center font-bold">
                                                <Icon name="activity" className="w-5 h-5" />
                                            </div>
                                            <h3 className="font-serif font-bold text-lg text-slate-900">Placental Clotting & Abruption</h3>
                                            <p className="text-xs text-slate-600 leading-relaxed">
                                                Clots formed in the uteroplacental arteries can cause premature placental separation (abruption), leading to severe maternal bleeding and acute fetal distress.
                                            </p>
                                        </div>

                                        <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-3">
                                            <div className="w-10 h-10 bg-brand-50 text-brand-600 rounded-xl flex items-center justify-center font-bold">
                                                <Icon name="baby" className="w-5 h-5" />
                                            </div>
                                            <h3 className="font-serif font-bold text-lg text-slate-900">IUGR (Poor Fetal Growth)</h3>
                                            <p className="text-xs text-slate-600 leading-relaxed">
                                                Intrauterine Growth Restriction occurs when reduced placental perfusion deprives the baby of vital nutrients, potentially causing birth weight deficiencies and developmental delays.
                                            </p>
                                        </div>

                                        <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-3">
                                            <div className="w-10 h-10 bg-brand-50 text-brand-600 rounded-xl flex items-center justify-center font-bold">
                                                <Icon name="zap" className="w-5 h-5" />
                                            </div>
                                            <h3 className="font-serif font-bold text-lg text-slate-900">Pre-Eclampsia</h3>
                                            <p className="text-xs text-slate-600 leading-relaxed">
                                                Gestational hypertension combined with vascular damage causes 1/3 of maternal deaths and is a frequent contributor to emergency premature delivery.
                                            </p>
                                        </div>

                                        <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-3 md:col-span-2 lg:col-span-2">
                                            <div className="w-10 h-10 bg-brand-50 text-brand-600 rounded-xl flex items-center justify-center font-bold">
                                                <Icon name="shield-alert" className="w-5 h-5" />
                                            </div>
                                            <h3 className="font-serif font-bold text-lg text-slate-900">Stillbirth Prevention & Fetal Kick Tracking</h3>
                                            <p className="text-xs text-slate-600 leading-relaxed">
                                                During the 3rd trimester, tracking daily fetal movement is a crucial indicator of placental wellbeing. A sudden decrease in fetal kicks can signal compromised placental blood flow. Organizations such as <strong>Count the Kicks</strong> (countthekicks.org) and <strong>Healthy Birth Day</strong> provide vital tracking tools for expectant parents.
                                            </p>
                                        </div>

                                    </div>

                                    {/* Survivor Testimonial Box */}
                                    <div className="bg-slate-900 text-white rounded-2xl p-8 border border-slate-800 space-y-4">
                                        <div className="text-brand-400 font-bold text-xs uppercase tracking-wider">Survivor & Family Testimonial</div>

                                        </blockquote>
                                        <div className="text-xs text-slate-400 font-semibold">— Emily Smith, Maternal/Fetal Clotting Survivor</div>
                                    </div>

                                </div>
                            </div>

                                                </li>

                                            The Shane Foundation is a registered 501(c)(3) nonprofit organization dedicated to raising public awareness, supporting scientific research, and protecting women and unborn children from blood clotting disorders.
